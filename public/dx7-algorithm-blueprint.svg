<svg xmlns="http://www.w3.org/2000/svg" width="420" height="280" viewBox="0 0 420 280">
  <g fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
    <!-- Algorithm 1: two carriers, with a four-operator modulation stack. -->
    <g transform="translate(22 20)">
      <path d="M72 12v18m0 12v18m0 12v18m0 12v13M72 115H40m32 0h32M40 102v13m64-13v13"/>
