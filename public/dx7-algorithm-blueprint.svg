      <circle cx="72" cy="66" r="6"/>
      <circle cx="72" cy="96" r="6"/>
      <circle cx="40" cy="96" r="6"/>
      <circle cx="104" cy="96" r="6"/>
      <path d="M66 6h-11v20h11"/>
    </g>

    <!-- A split pair of three-operator stacks. -->
    <g transform="translate(232 24)">
      <path d="M34 12v22m0 12v22m0 12v18M92 12v22m0 12v22m0 12v18M18 98h90"/>
      <circle cx="34" cy="6" r="6"/>
      <circle cx="34" cy="40" r="6"/>
      <circle cx="34" cy="74" r="6"/>
      <circle cx="92" cy="6" r="6"/>
      <circle cx="92" cy="40" r="6"/>
      <circle cx="92" cy="74" r="6"/>
      <path d="M98 6h11v22H98"/>
    </g>

    <!-- Branching modulation feeding three carriers. -->
    <g transform="translate(76 160)">
      <path d="M58 12v18m0 12v16H24m34 0h34M24 58v18m68-18v18M24 88v14m34-14v14m34-14v14M10 102h96"/>
