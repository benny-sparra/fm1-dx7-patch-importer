      <circle cx="24" cy="82" r="6"/>
      <circle cx="58" cy="82" r="6"/>
      <circle cx="92" cy="82" r="6"/>
      <circle cx="24" cy="52" r="6"/>
      <path d="M52 6H41v19h11"/>
    </g>

    <!-- Six parallel carriers, as in the additive-style DX7 algorithms. -->
    <g transform="translate(258 177)">
      <path d="M10 22v24m24-24v24m24-24v24m24-24v24m24-24v24m24-24v24M0 46h140"/>
