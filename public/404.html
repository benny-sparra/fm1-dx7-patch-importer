<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found</title>
  </head>
  <!--
    Served for any path the site does not hold, so a chunk an old deployment named returns 404
    rather than the editor's index.html. Plain HTML: the CSP allows no inline <style> element, only
    style attributes.
  -->
  <body
    style="
      margin: 0;
      padding: 3rem 1rem;
      background: #1a1a1a;
      color: #e8e8e8;
      font:
        1rem/1.5 ui-monospace,
        monospace;
    "
  >
    <main style="max-width: 36rem; margin: 0 auto">
      <h1 style="font-size: 1.5rem">Page not found</h1>
      <p>There is nothing at this address.</p>
      <p>
        <a href="/" style="color: #7fd88f">Open the M-VAVE FM1 Editor &amp; Librarian</a>
      </p>
    </main>
  </body>
</html>
