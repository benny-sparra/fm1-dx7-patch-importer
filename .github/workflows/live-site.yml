name: Live site

# Cloudflare deploys outside GitHub, so this watches what fm1-editor.com actually serves. A failed
# scheduled run emails the repository's owner.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware-page:
    name: Firmware page is served
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Check the live firmware page
        run: npm run live:firmware:check
