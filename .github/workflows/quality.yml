name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint TypeScript and React
        run: npm run lint:code
      - name: Lint CSS
        run: npm run lint:css
      - name: Type-check
        run: npm run typecheck
      - name: Check dependencies, files, and exports
        run: npm run deps:check
      - name: Run unit and accessibility tests
        run: npm test
      - name: Check responsive image assets
        run: npm run images:check
      - name: Check installed-app icons
        run: npm run icons:check
      - name: Build production bundle
        run: npm run build
      - name: Check responsive production assets
        run: npm run images:check:dist
      - name: Check production security headers
        run: npm run security:check
      - name: Check production source maps
        run: npm run sourcemaps:check
      - name: Check initial JavaScript budget
        run: npm run bundle:check

  audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Audit production dependencies
        run: npm run deps:audit:prod
      - name: Audit the full dependency tree
        run: npm run deps:audit

  browser-tests:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read the Playwright and runner image versions
        id: versions
        run: |
          echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
          echo "image-os=${ImageOS}" >> "$GITHUB_OUTPUT"
          echo "image-version=${ImageVersion}" >> "$GITHUB_OUTPUT"
      # The browsers' system packages come from the runner's Ubuntu mirror, which has delivered
      # them at 64 kB/s, taking 15 minutes. Keeping the downloaded packages lets apt install them
      # without the mirror; it fetches only those the runner image has since updated. The directory
      # sits outside the home directory, which apt's unprivileged download user cannot enter.
      - name: Keep downloaded system packages for the cache
        run: |
          sudo install -d -o "$USER" /var/cache/playwright-apt
          mkdir /var/cache/playwright-apt/partial
          printf 'Dir::Cache::Archives "/var/cache/playwright-apt";\nAPT::Keep-Downloaded-Packages "true";\n' |
            sudo tee /etc/apt/apt.conf.d/99-playwright-cache
      - name: Restore browser system packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/playwright-apt/*.deb
          key: playwright-apt-${{ steps.versions.outputs.image-os }}-${{ steps.versions.outputs.image-version }}-${{ steps.versions.outputs.playwright }}
          restore-keys: playwright-apt-${{ steps.versions.outputs.image-os }}-
      - name: Install browser system packages
        timeout-minutes: 8
        run: npx playwright install-deps chromium firefox
      - name: Restore Chromium and Firefox
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.versions.outputs.playwright }}
      - name: Install Chromium and Firefox
        if: steps.browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium firefox
      - name: Run browser journeys
        run: npm run test:e2e
