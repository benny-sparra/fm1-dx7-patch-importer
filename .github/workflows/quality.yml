name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Deterministic checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint TypeScript and React
        run: npm run lint:code
      - name: Lint CSS
        run: npm run lint:css
      - name: Type-check
        run: npm run typecheck
      - name: Check dependencies, files, and exports
        run: npm run deps:check
      - name: Run unit and accessibility tests
        run: npm test
      - name: Check responsive image sources
        run: npm run images:check
      - name: Build production bundle
        run: npm run build
      - name: Check responsive production assets
        run: npm run images:check:dist
      - name: Check production source maps
        run: npm run sourcemaps:check
      - name: Check initial JavaScript budget
        run: npm run bundle:check

  audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .node-version
      - name: Audit production dependencies
        run: npm run deps:audit:prod
      - name: Audit the full dependency tree
        run: npm run deps:audit
